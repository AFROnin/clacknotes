[project]
name = "clack"
version = "0.1.0"
description = "Local browser notes app with FastAPI, SQLite, and plain JavaScript"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=25,<26",
  "email-validator>=2,<3",
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.35,<1",
  "python-multipart>=0.0.20,<1",
  "qrcode>=8,<9",
]

[tool.uv]
package = false
